name: Instagram Scraper (Instaloader)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Instagram Username'
        required: true
      max_count:
        description: 'Max Videos to check'
        required: false
        default: '50'

jobs:
  scrape-profile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Instaloader
      run: |
        pip install instaloader

    - name: Run Scraper Script
      run: |
        python3 -c "
        import instaloader
        import json
        import os
        import sys

        # Inputs from GitHub Actions
        USERNAME = '${{ inputs.username }}'
        MAX_COUNT = int('${{ inputs.max_count }}')

        def scrape_user_data(username, max_count):
            print(f'--- Starting Scrape for {username} ---')
            
            # Initialize Instaloader
            # Note: GitHub IPs par login issues aa sakte hain, isliye hum aggressive settings off kar rahe hain
            L = instaloader.Instaloader(
                download_pictures=False,
                download_videos=False, 
                download_video_thumbnails=False,
                download_geotags=False,
                download_comments=False,
                save_metadata=False,
                compress_json=False
            )

            try:
                profile = instaloader.Profile.from_username(L.context, username)
            except instaloader.ConnectionException as e:
                print(f'Connection Error (IP Blocked?): {e}')
                return None
            except instaloader.ProfileNotExistsException:
                print('Profile not found!')
                return None
            except Exception as e:
                print(f'Error: {e}')
                return None

            # JSON Structure setup
            data = {
                'username': profile.username,
                'full_name': profile.full_name,
                'biography': profile.biography,
                'profile_pic_url': profile.profile_pic_url,
                'followers': profile.followers,
                'videos': []
            }

            count = 0
            print(f'Fetching posts for {username}...')
            
            try:
                posts = profile.get_posts()
                for post in posts:
                    if count >= max_count:
                        break
                    
                    # Sirf Videos/Reels chahiye
                    if post.is_video:
                        print(f'Found Video: {post.shortcode}')
                        
                        video_info = {
                            'shortcode': post.shortcode,
                            'caption': post.caption if post.caption else '',
                            'upload_date': str(post.date_local),
                            'video_url': post.video_url, # Direct CDN Download Link
                            'thumbnail_url': post.url,   # High Quality Cover
                            'likes': post.likes,
                            'comments': post.comments,
                            'view_count': post.video_view_count,
                            'duration': post.video_duration
                        }
                        
                        data['videos'].append(video_info)
                        count += 1
                        
            except Exception as e:
                print(f'Loop Error: {e}')

            return data

        # Execution
        result = scrape_user_data(USERNAME, MAX_COUNT)

        if result:
            filename = f'{USERNAME}_data.json'
            with open(filename, 'w', encoding='utf-8') as f:
                json.dump(result, f, indent=4, default=str)
            print(f'Success! Saved {len(result[\"videos\"])} videos to {filename}')
        else:
            print('Failed to scrape data.')
            sys.exit(1) # Mark action as failed
        "

    - name: Upload JSON Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: instagram-json
        path: "*.json"